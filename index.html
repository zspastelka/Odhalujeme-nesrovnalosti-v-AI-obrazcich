<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Odhalujeme nesrovnalosti</title>

<style>
body { font-family: Arial; background:#f4f6f8; }

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.case {
  background:white;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.case img {
  width:100%;
  height:200px;
  object-fit:contain;
  cursor:pointer;
}

button {
  margin:5px;
  padding:5px 10px;
}

/* fullscreen */
#viewer {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

#viewer img {
  max-width:90%;
  max-height:90%;
}

#close {
  position:absolute;
  top:20px;
  right:30px;
  color:white;
  font-size:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Odhalujeme nesrovnalosti</h1>

<div class="grid">

<!-- ✅ OBRÁZEK 1 -->
<div class="case">
<h3>Obrázek 1</h3>

<img src="https://raw.githubusercontent.com/zspastelka/Odhalujeme-nesrovnalosti-v-AI-obrazcich/main/img/1/Fale%C5%A1%20nebo%20pravda%201.jpg">

<br>

<button onclick="check(1,'fake')">❌ Fake</button>
<button onclick="check(1,'pravda')">✅ Pravda</button>

<div id="r1"></div>

<button onclick="showSolution('https://raw.githubusercontent.com/zspastelka/Odhalujeme-nesrovnalosti-v-AI-obrazcich/main/img/1/FnP%201.jpg')">
🔍 Řešení
</button>
</div>


<!-- ✅ OBRÁZEK 2 -->
<div class="case">
<h3>Obrázek 2</h3>

<img src="https://raw.githubusercontent.com/zspastelka/Odhalujeme-nesrovnalosti-v-AI-obrazcich/main/img/2/Fale%C5%A1%20nebo%20pravda%202.jpg">

<br>

<button onclick="check(2,'fake')">❌ Fake</button>
<button onclick="check(2,'pravda')">✅ Pravda</button>

<div id="r2"></div>

<button onclick="showSolution('https://raw.githubusercontent.com/zspastelka/Odhalujeme-nesrovnalosti-v-AI-obrazcich/main/img/2/FnP%202.jpg')">
🔍 Řešení
</button>
</div>

</div>

<!-- FULLSCREEN -->
<div id="viewer">
  <div id="close" onclick="closeViewer()">✖</div>
  <img id="bigImg">
</div>

<script>

// ✅ SPRÁVNÉ ODPOVĚDI
const answers = {
  1: "fake",
  2: "pravda"
};

// ✅ KONTROLA ODPOVĚDI
function check(id, val){
  const result = document.getElementById("r"+id);
  result.textContent =
    answers[id] === val ? "✅ Správně!" : "❌ Špatně!";
}

// ✅ ŘEŠENÍ
function showSolution(src){
  document.getElementById("bigImg").src = src;
  document.getElementById("viewer").style.display = "flex";
}

// ✅ ZAVŘENÍ
function closeViewer(){
  document.getElementById("viewer").style.display = "none";
}

</script>

</body>
</html>
